name: One IP Server / One IP Web
run-name: >-
  ${{ startsWith(github.ref_name, 'deploy-server-') && 'One IP Server' || startsWith(github.ref_name, 'deploy-web-') && 'One IP Web' || 'One IP Server + One IP Web' }} (${{ github.ref_name }})

"on":
  push:
    tags:
      - deploy-all-*
      - deploy-server-*
      - deploy-web-*

permissions:
  contents: read

env:
  PAGES_PROJECT: ipbot
  PAGES_BRANCH: main

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      target: ${{ steps.release.outputs.target }}
      version: ${{ steps.release.outputs.version }}
      backend_ref: ${{ steps.release.outputs.backend_ref }}
      web_ref: ${{ steps.release.outputs.web_ref }}
      action_sha: ${{ steps.release.outputs.action_sha }}
      release_tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release
        id: release
        env:
          REPOSITORY: ${{ github.repository }}
          ACTION_SHA: ${{ github.sha }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).rstrip("\n")

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          ref = os.environ["RELEASE_REF"]
          tag = os.environ["RELEASE_TAG"]
          action_sha = os.environ["ACTION_SHA"]
          require(os.environ["REPOSITORY"] == "oldbaby5566/ipbot-action", "Unexpected Action repository")
          require(ref == f"refs/tags/{tag}", "Release must be triggered by a tag")
          require(git("cat-file", "-t", ref) == "tag", "Release requires an annotated tag")
          require(git("rev-parse", f"{ref}^{{commit}}") == action_sha, "Action tag commit mismatch")
          subject = git("for-each-ref", "--format=%(contents:subject)", ref)
          annotation = git("for-each-ref", "--format=%(contents)", ref)
          require(annotation == subject and "\n" not in subject, "Tag annotation must be a single JSON line")
          release = json.loads(subject)
          require(isinstance(release, dict), "Tag annotation must be a JSON object")
          require(set(release) == {"target", "version", "backend_ref", "web_ref", "expected_action_sha"}, "Unexpected release fields")
          require(all(isinstance(value, str) for value in release.values()), "Release fields must be strings")
          target = release["target"]
          version = release["version"]
          require(target in ("server", "web", "all"), "Invalid release target")
          require(re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", version), "Invalid release version")
          require(tag == f"deploy-{target}-{version}", "Release tag does not match its annotation")
          require(re.fullmatch(r"[0-9a-f]{40}", action_sha), "Invalid Action commit")
          require(release["expected_action_sha"] == action_sha, "Expected Action commit mismatch")
          sources = {"server": {"backend_ref"}, "web": {"web_ref"}, "all": {"backend_ref", "web_ref"}}[target]
          for field in ("backend_ref", "web_ref"):
              if field in sources:
                  require(re.fullmatch(r"[0-9a-f]{40}", release[field]), f"Invalid {field}")
              else:
                  require(release[field] == "", f"Unexpected {field} for release target")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for key in ("target", "version", "backend_ref", "web_ref"):
                  output.write(f"{key}={release[key]}\n")
              output.write(f"action_sha={action_sha}\n")
              output.write(f"release_tag={tag}\n")
          PY

  web:
    name: One IP Web
    needs: prepare
    if: needs.prepare.outputs.target != 'server'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: one-ip-web-prod
      cancel-in-progress: false
    environment:
      name: prod
      url: https://ipbot.net
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: oldbaby5566/ipbot-web
          ref: ${{ needs.prepare.outputs.web_ref }}
          path: web
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build Web
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build
          test -f web/dist/index.html
          test -f web/dist/app-version.json
          test -z "$(find web/dist -type l -print -quit)"
          printf '%s\n' "$VERSION" > web/dist/one-web-revision.txt
      - name: Upload Web to Cloudflare Pages
        working-directory: web
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WEB_SHA: ${{ needs.prepare.outputs.web_ref }}
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_ACCOUNT_ID:?Set CLOUDFLARE_ACCOUNT_ID in prod}"
          : "${CLOUDFLARE_API_TOKEN:?Set CLOUDFLARE_API_TOKEN in prod}"
          pnpm --silent dlx wrangler@4 pages project list --json > "$RUNNER_TEMP/pages-projects.json"
          project_exists=$(node -e 'const fs = require("node:fs"); const projects = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); console.log(projects.some(project => project["Project Name"] === process.env.PAGES_PROJECT));' "$RUNNER_TEMP/pages-projects.json")
          if [ "$project_exists" = false ]; then
            pnpm dlx wrangler@4 pages project create "$PAGES_PROJECT" --production-branch "$PAGES_BRANCH"
          fi
          pnpm dlx wrangler@4 pages deploy dist --project-name "$PAGES_PROJECT" \
            --branch "$PAGES_BRANCH" --commit-hash "$WEB_SHA" --commit-dirty=true

  server:
    name: One IP Server
    needs: prepare
    if: needs.prepare.outputs.target != 'web'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment:
      name: prod
      url: https://api.ipbot.net
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.action_sha }}
          path: action
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: oldbaby5566/ipbot-server
          ref: ${{ needs.prepare.outputs.backend_ref }}
          path: backend
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .cache/cargo
            .cache/target
            .cache/fonts
          key: ipbot-server-amd64-${{ hashFiles('backend/Cargo.lock', 'backend/rust-toolchain.toml') }}-${{ needs.prepare.outputs.backend_ref }}
          restore-keys: |
            ipbot-server-amd64-${{ hashFiles('backend/Cargo.lock', 'backend/rust-toolchain.toml') }}-
            ipbot-server-amd64-
      - name: Build and package Server
        working-directory: action
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: make build-server
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server
          path: |
            dist/server-image.tar.gz
            dist/docker-compose.yml
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

  publish:
    name: One IP Server Release
    needs: [prepare, server]
    if: ${{ !cancelled() && needs.server.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      checksum: ${{ steps.release.outputs.checksum }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: server
          path: dist
      - name: Publish public Server release assets
        id: release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ACTION_SHA: ${{ needs.prepare.outputs.action_sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          BACKEND_SHA: ${{ needs.prepare.outputs.backend_ref }}
        run: |
          set -euo pipefail
          assets=(server-image.tar.gz docker-compose.yml)
          sha256sum "${assets[@]}" > checksums.txt
          printf 'checksum=%s\n' "$(sha256sum checksums.txt | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          printf 'Server: %s\nAction: %s\n' "$BACKEND_SHA" "$ACTION_SHA" > release.txt
          gh release create "$RELEASE_TAG" "${assets[@]}" checksums.txt \
            --verify-tag --title "One IP server $VERSION" --notes-file release.txt --latest=false

  deploy:
    name: One IP Server Deploy
    needs: [prepare, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: one-ip-server-prod
      cancel-in-progress: false
    environment:
      name: prod
      url: https://api.ipbot.net
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.action_sha }}
          path: action
          persist-credentials: false
      - name: Configure SSH
        working-directory: action
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: '22'
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: make configure-ssh
      - name: Download on server and deploy API
        working-directory: action
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          CHECKSUM: ${{ needs.publish.outputs.checksum }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          make publish-server DEPLOY_VERSION="$VERSION" DEPLOY_CHECKSUM="$CHECKSUM" DEPLOY_RELEASE_TAG="$RELEASE_TAG"
      - name: Public API readiness check
        run: |
          set -uo pipefail
          for attempt in 1 2 3 4 5 6; do
            echo "Public API readiness check $attempt/6"
            status=$(curl --silent --max-time 10 --output /dev/null --dump-header headers.txt \
              --write-out '%{http_code}' https://api.ipbot.net/readyz)
            [ "$status" = 200 ] && exit 0
            if [ "$status" = 403 ] && grep -qiE '^(cf-mitigated|server: cloudflare)' headers.txt; then
              echo '::warning::Cloudflare refused the runner; origin readiness passed over SSH.'
              exit 0
            fi
            sleep 5
          done
          echo "Public API readiness check failed with HTTP $status" >&2
          exit 1
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/ipbot_deploy
