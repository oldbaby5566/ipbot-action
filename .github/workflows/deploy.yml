name: One IP Deploy

"on":
  workflow_dispatch:
    inputs:
      target:
        description: server = API Docker; web = Cloudflare Pages
        required: true
        type: choice
        options: [server, web]
      version: { required: true, type: string }
      backend_ref: { description: Exact ipbot-server commit (server only), required: false, type: string }
      web_ref: { description: Exact ipbot-web commit (web only), required: false, type: string }
      expected_action_sha: { description: Exact ipbot-action commit, required: true, type: string }

permissions:
  contents: read

concurrency:
  group: one-ip-${{ inputs.target }}-prod
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Validate release
        env:
          REPOSITORY: ${{ github.repository }}
          ACTION_SHA: ${{ github.sha }}
          EXPECTED_ACTION_SHA: ${{ inputs.expected_action_sha }}
          TARGET: ${{ inputs.target }}
          VERSION: ${{ inputs.version }}
          BACKEND_SHA: ${{ inputs.backend_ref }}
          WEB_SHA: ${{ inputs.web_ref }}
        run: |
          set -euo pipefail
          [[ "$REPOSITORY" == oldbaby5566/ipbot-action && "$ACTION_SHA" == "$EXPECTED_ACTION_SHA" ]]
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          case "$TARGET" in
            server) [[ "$BACKEND_SHA" =~ ^[0-9a-f]{40}$ ]] ;;
            web) [[ "$WEB_SHA" =~ ^[0-9a-f]{40}$ ]] ;;
            *) exit 1 ;;
          esac

  web:
    needs: prepare
    if: inputs.target == 'web'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: one-ip-pages-prod
      url: https://ipbot.net
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: oldbaby5566/ipbot-web
          ref: ${{ inputs.web_ref }}
          path: web
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build Web
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build
          test -f web/dist/index.html
          test -f web/dist/app-version.json
          test -z "$(find web/dist -type l -print -quit)"
          printf '%s\n' "$VERSION" > web/dist/one-web-revision.txt
      - name: Upload Web to Cloudflare Pages
        working-directory: web
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'ipbot' }}
          PAGES_BRANCH: ${{ vars.CLOUDFLARE_PAGES_BRANCH || 'main' }}
          WEB_SHA: ${{ inputs.web_ref }}
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_ACCOUNT_ID:?Set CLOUDFLARE_ACCOUNT_ID in one-ip-pages-prod}"
          : "${CLOUDFLARE_API_TOKEN:?Set CLOUDFLARE_API_TOKEN in one-ip-pages-prod}"
          pnpm dlx wrangler@4 pages deploy dist --project-name "$PAGES_PROJECT" \
            --branch "$PAGES_BRANCH" --commit-hash "$WEB_SHA" --commit-dirty=true

  server:
    needs: prepare
    if: inputs.target == 'server'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: action
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: oldbaby5566/ipbot-server
          ref: ${{ inputs.backend_ref }}
          path: backend
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .cache/cargo
            .cache/target
            .cache/fonts
          key: ipbot-server-amd64-${{ hashFiles('backend/Cargo.lock', 'backend/rust-toolchain.toml') }}-${{ inputs.backend_ref }}
          restore-keys: |
            ipbot-server-amd64-${{ hashFiles('backend/Cargo.lock', 'backend/rust-toolchain.toml') }}-
            ipbot-server-amd64-
      - name: Build and package Server
        env:
          VERSION: ${{ inputs.version }}
        run: bash action/scripts/build-server.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server
          path: |
            dist/server-image.tar.gz
            dist/docker-compose.yml
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

  publish:
    needs: server
    if: ${{ !cancelled() && needs.server.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      checksum: ${{ steps.release.outputs.checksum }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: server
          path: dist
      - name: Publish public Server release assets
        id: release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ACTION_SHA: ${{ github.sha }}
          VERSION: ${{ inputs.version }}
          BACKEND_SHA: ${{ inputs.backend_ref }}
        run: |
          set -euo pipefail
          assets=(server-image.tar.gz docker-compose.yml)
          sha256sum "${assets[@]}" > checksums.txt
          printf 'checksum=%s\n' "$(sha256sum checksums.txt | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          printf 'Server: %s\nAction: %s\n' "$BACKEND_SHA" "$ACTION_SHA" > release.txt
          gh release create "deploy-server-$VERSION" "${assets[@]}" checksums.txt \
            --target "$ACTION_SHA" --title "One IP server $VERSION" --notes-file release.txt --latest=false

  deploy:
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: one-ip-prod
      url: https://api.ipbot.net
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: action
          persist-credentials: false
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: bash action/scripts/configure-ssh.sh
      - name: Download on server and deploy API
        working-directory: action
        env:
          VERSION: ${{ inputs.version }}
          CHECKSUM: ${{ needs.publish.outputs.checksum }}
        run: |
          make publish-server DEPLOY_TRANSFER=release DEPLOY_HOST=ipbot \
            DEPLOY_IMAGE="one-ip:$VERSION" DEPLOY_VERSION="$VERSION" \
            DEPLOY_RELEASE="deploy-server-$VERSION" DEPLOY_CHECKSUM="$CHECKSUM"
      - name: Public API readiness check
        run: |
          set -uo pipefail
          for attempt in 1 2 3 4 5 6; do
            echo "Public API readiness check $attempt/6"
            status=$(curl --silent --max-time 10 --output /dev/null --dump-header headers.txt \
              --write-out '%{http_code}' https://api.ipbot.net/readyz)
            [ "$status" = 200 ] && exit 0
            if [ "$status" = 403 ] && grep -qiE '^(cf-mitigated|server: cloudflare)' headers.txt; then
              echo '::warning::Cloudflare refused the runner; origin readiness passed over SSH.'
              exit 0
            fi
            sleep 5
          done
          echo "Public API readiness check failed with HTTP $status" >&2
          exit 1
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/ipbot_deploy
